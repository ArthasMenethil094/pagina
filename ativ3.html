<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página html</title>
</head>
<body>
   
     <!-- Cabecalho -->
      <header>
        <h1>Sua Winx Favorita</h1>
      </header>
    
 
        <!-- Formularios -->
           <section>
            <h2>Formulario simples</h2>
            <form>
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="NickName" />
                </div>
 
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" />
 
 
                </div>
 
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" />
 
 
                </div>
 
                <div>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" placeholder="NickName"></textarea>
 
 
                </div>
 
 
 
                <div>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="10" max="50" />
                </div>
 
 
                <div>
                    <label for="cor">Cor: </label>
                    <input type="color" id="cor" />
                </div>
 
                <div>
                    <label for="anexo">Anexo:</label>
                    <input type="file" id="anexo">
                </div>
 
 
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </form>
           </section>
 
      </main>
     <!-- Rodape -->
    <footer>
        <p>
            &copy; Todos os direitos reservados
        </p>
    </footer>
 
 
</body>
</html>
